apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  name: cluster-9flm8-dumps-arm64-eu-west-1b
  namespace: openshift-machine-api
  labels:
    machine.openshift.io/cluster-api-cluster: cluster-9flm8
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    machine.openshift.io/GPU: "0"
    machine.openshift.io/vCPU: "8"
    machine.openshift.io/memoryMb: "32768"
    capacity.cluster-autoscaler.kubernetes.io/labels: kubernetes.io/arch=arm64,workload=trustify-dumps
    capacity.cluster-autoscaler.kubernetes.io/taints: workload=trustify-dumps:NoSchedule
spec:
  # Initial creation only; the autoscaler owns replicas thereafter.
  replicas: 0
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: cluster-9flm8
      machine.openshift.io/cluster-api-machineset: cluster-9flm8-dumps-arm64-eu-west-1b
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: cluster-9flm8
        machine.openshift.io/cluster-api-machine-role: worker
        machine.openshift.io/cluster-api-machine-type: worker
        machine.openshift.io/cluster-api-machineset: cluster-9flm8-dumps-arm64-eu-west-1b
    spec:
      metadata:
        labels:
          workload: trustify-dumps
      taints:
        - key: workload
          value: trustify-dumps
          effect: NoSchedule
      providerSpec:
        value:
          apiVersion: machine.openshift.io/v1beta1
          kind: AWSMachineProviderConfig
          # Bootstrap image from the existing Arm pool. MCO owns future updates.
          ami:
            id: ami-0f4d9842004c86853
          instanceType: m9g.2xlarge
          blockDevices:
            - ebs:
                encrypted: true
                volumeSize: 120
                volumeType: gp3
          credentialsSecret:
            name: aws-cloud-credentials
          iamInstanceProfile:
            id: cluster-9flm8-worker-profile
          deviceIndex: 0
          placement:
            availabilityZone: eu-west-1b
            region: eu-west-1
          securityGroups:
            - filters:
                - name: tag:Name
                  values:
                    - cluster-9flm8-worker-sg
          subnet:
            filters:
              - name: tag:Name
                values:
                  - cluster-9flm8-private-eu-west-1b
          tags:
            - name: kubernetes.io/cluster/cluster-9flm8
              value: owned
          userDataSecret:
            name: worker-user-data
