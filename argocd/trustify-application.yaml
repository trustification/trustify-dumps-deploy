apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trustify
  namespace: trustify-gitops
  # Deliberately no cascading-deletion finalizer.
spec:
  project: trustify
  sources:
    - repoURL: https://github.com/guacsec/trustify-helm-charts.git
      targetRevision: 581135ce301102f871a3456a13d41d562cfe5c34
      path: charts/trustify
      helm:
        releaseName: trustify
        valueFiles:
          - $values/deploy/trustify/values.yaml
    - repoURL: https://github.com/trustification/trustify-dumps-deploy.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: trustify
  # Enable automated self-healing after the manual reset and first sync.
  syncPolicy:
    syncOptions:
      - FailOnSharedResource=true
