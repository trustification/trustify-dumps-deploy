apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trustify-dumps-autoscaling-test
  namespace: openshift-gitops
spec:
  project: trustify-dumps-autoscaling
  source:
    repoURL: https://github.com/trustification/trustify-gitops.git
    targetRevision: main
    path: infra/autoscaling/tests
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-machine-api
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
