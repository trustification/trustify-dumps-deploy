apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trustify-platform
  namespace: trustify-gitops
  # Deliberately no cascading-deletion finalizer.
spec:
  project: trustify
  source:
    repoURL: https://github.com/trustification/trustify-gitops.git
    targetRevision: main
    path: deploy/trustify/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: trustify
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - FailOnSharedResource=true
