apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: trustify
  namespace: trustify-gitops
spec:
  description: Trustify application and operator-managed observability
  sourceRepos:
    - https://github.com/trustification/trustify-gitops.git
    - https://guacsec.github.io/trustify-helm-charts/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: trustify
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: "", kind: ConfigMap}
    - {group: "", kind: Service}
    - {group: apps, kind: Deployment}
    - {group: batch, kind: Job}
    - {group: networking.k8s.io, kind: Ingress}
    - {group: monitoring.coreos.com, kind: ServiceMonitor}
    - {group: opentelemetry.io, kind: OpenTelemetryCollector}
    - {group: tempo.grafana.com, kind: TempoStack}
