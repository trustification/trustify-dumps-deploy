apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trustify
  namespace: trustify-gitops
  # Deliberately no cascading-deletion finalizer.
spec:
  project: trustify
  sources:
    - repoURL: https://guacsec.github.io/trustify-helm-charts/
      targetRevision: 0.3.4
      chart: trustify
      helm:
        releaseName: trustify
        valueFiles:
          - $values/deploy/trustify/values.yaml
    - repoURL: https://github.com/trustification/trustify-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: trustify
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - FailOnSharedResource=true
