apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trustify-dumps
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/trustification/trustify-dumps-deploy.git
    targetRevision: main
    path: deploy/overlays/all
  destination:
    server: https://kubernetes.default.svc
    namespace: trustify-dumps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
