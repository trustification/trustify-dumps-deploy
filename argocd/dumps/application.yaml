apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trustify-dumps
  namespace: trustify-gitops
spec:
  project: trustify-dumps
  source:
    repoURL: https://github.com/trustification/trustify-gitops.git
    targetRevision: main
    path: deploy/dumps/overlays/all
  destination:
    server: https://kubernetes.default.svc
    namespace: trustify-dumps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
