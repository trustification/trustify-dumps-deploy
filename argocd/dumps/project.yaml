apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: trustify-dumps
  namespace: trustify-gitops
spec:
  description: Trustify dump generation
  sourceRepos:
    - https://github.com/trustification/trustify-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: trustify-dumps
  # no cluster-scoped resources
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: batch
      kind: CronJob
