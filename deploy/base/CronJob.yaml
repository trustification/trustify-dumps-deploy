kind: CronJob
apiVersion: batch/v1
metadata:
  name: trustify-dumps-create-dump
  labels:
    app.kubernetes.io/name: trustify-dumps-create-dump
    app.kubernetes.io/component: create-dump
    app.kubernetes.io/part-of: trustify-dumps
spec:
  schedule: "0 1 * * *"
  suspend: false

  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 0
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: trustify-dumps-create-dump
            app.kubernetes.io/component: create-dump
            app.kubernetes.io/part-of: trustify-dumps
        spec:
          restartPolicy: OnFailure
          containers:
            - name: run
              image: ghcr.io/guacsec/xtask:latest
              env:
                - name: TRUSTD_DB_MIN_CONN
                  value: "8"
                - name: TRUSTD_DB_MAX_CONN
                  value: "32"
                - name: TRUSTD_CORRELATION_WORKERS
                  value: "4"
                - name: TRUSTD_CORRELATION_WORK_MEM
                  value: "256MiB"
                - name: TRUSTD_EMBEDDED_PG_SETTINGS
                  value: "max_wal_size=8GB"
                - name: RUST_LOG
                  value: info
                - name: S3_BUCKET_NAME
                  value: "trustify-dumps"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: aws-secret
                      key: access_key_id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aws-secret
                      key: secret_access_key
                - name: AWS_DEFAULT_REGION
                  value: "eu-west-1"
                - name: INPUT_FILE
                  value: "input.yaml"
              command:
                - bash
                - -c
                - |
                  set -e
                  set -o pipefail

                  WORK=/mnt/data/builder/work
                  mkdir -p "$WORK"
                  cd "$WORK"

                  run() {
                      set -xe
                      set -o pipefail
                      export TRUSTD_STORAGE_FS_PATH=$WORK/storage # need this for now, because of data migration
                      /usr/local/bin/xtask generate-dump --keep-going --working-dir "$WORK" --output "$WORK/dump.sql" --input "/etc/config/$INPUT_FILE" |& tee "$WORK/dump.log"

                      rm -f dump.sql.xz
                      rm -f dump.log.xz

                      xz dump.sql
                      xz dump.log

                      pushd storage
                      tar cvf ../dump.tar .
                      popd

                      tar cvf - storage db | xz > storage.tar.xz

                      DATE=$(date -u +"%Y%m%dT%H%M%SZ")

                      for i in dump.tar dump.log.xz dump.sql.xz storage.tar.xz; do
                          sha256sum "$i" > "${i}.sha256"
                          aws s3 cp "$i" "s3://$S3_BUCKET_NAME/$DATE/$i"
                          aws s3 cp "${i}.sha256" "s3://$S3_BUCKET_NAME/$DATE/${i}.sha256"
                      done
                  }

                  # capture the complete output, and upload it in case of a failure
                  # don't use "|| rc=$?" here, it would disable "set -e" inside the function
                  set +e
                  run 2>&1 | tee "$WORK/job.log"
                  rc=$?
                  set -e
                  if [ "$rc" -ne 0 ]; then
                      DATE=$(date -u +"%Y%m%dT%H%M%SZ")
                      echo "Job failed (exit code: $rc), uploading log to s3://$S3_BUCKET_NAME/failed/$DATE/"
                      xz -c "$WORK/job.log" > "$WORK/job.log.xz"
                      aws s3 cp "$WORK/job.log.xz" "s3://$S3_BUCKET_NAME/failed/$DATE/job.log.xz" || echo "Failed to upload log"
                      exit "$rc"
                  fi
              resources:
                requests:
                  cpu: "4"
                  memory: 12Gi
              imagePullPolicy: Always
              volumeMounts:
                - mountPath: /etc/config
                  name: config
                  readOnly: true
                - mountPath: /mnt/data/builder
                  name: builder
                  readOnly: false
          volumes:
            - name: config
              configMap:
                name: trustify-dumps-import-config
            - name: builder
              ephemeral:
                volumeClaimTemplate:
                  spec:
                    accessModes: [ "ReadWriteOnce" ]
                    resources:
                      requests:
                        storage: 512Gi
