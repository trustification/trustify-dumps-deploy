apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: trustify-dumps-create-dump
      spec:
        schedule: "0 6 * * *"
        jobTemplate:
          spec:
            activeDeadlineSeconds: null
            template:
              metadata:
                annotations:
                  cluster-autoscaler.kubernetes.io/safe-to-evict: null
              spec:
                nodeSelector: null
                tolerations: null
                volumes:
                  - name: builder
                    ephemeral:
                      volumeClaimTemplate:
                        spec:
                          accessModes: [ "ReadWriteOnce" ]
                          resources:
                            requests:
                              storage: 16Gi
                containers:
                  - name: run
                    resources:
                      requests:
                        cpu: null
                        memory: 6Gi
                    env:
                      - name: TRUSTD_DB_MIN_CONN
                        value: "2"
                      - name: TRUSTD_DB_MAX_CONN
                        value: "4"
                      - name: TRUSTD_CORRELATION_WORKERS
                        $patch: delete
                      - name: TRUSTD_CORRELATION_WORK_MEM
                        $patch: delete
                      - name: TRUSTD_EMBEDDED_PG_SETTINGS
                        $patch: delete
                      - name: S3_BUCKET_NAME
                        value: "trustify-dumps-small"
                      - name: INPUT_FILE
                        value: "input-small.yaml"
  - patch: |-
      - op: replace
        path: /metadata/name
        value: trustify-dumps-create-dump-small
    target:
      kind: CronJob
      name: trustify-dumps-create-dump
