{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "Ingress",
  "metadata": {
    "name": "server-vanity",
    "namespace": "trustify",
    "annotations": {
      "route.openshift.io/termination": "reencrypt"
    }
  },
  "spec": {
    "ingressClassName": "openshift-default",
    "rules": [
      {
        "host": "trustification.dev",
        "http": {
          "paths": [
            {
              "backend": {
                "service": {
                  "name": "server",
                  "port": {
                    "name": "endpoint"
                  }
                }
              },
              "path": "/",
              "pathType": "Prefix"
            }
          ]
        }
      }
    ]
  }
}
