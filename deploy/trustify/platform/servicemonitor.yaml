{
  "apiVersion": "monitoring.coreos.com/v1",
  "kind": "ServiceMonitor",
  "metadata": {
    "name": "otel-collector-app-metrics",
    "namespace": "trustify"
  },
  "spec": {
    "endpoints": [
      {
        "interval": "30s",
        "path": "/metrics",
        "port": "prometheus"
      }
    ],
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "otel-collector"
      }
    }
  }
}
