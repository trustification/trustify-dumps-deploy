{
  "apiVersion": "opentelemetry.io/v1beta1",
  "kind": "OpenTelemetryCollector",
  "metadata": {
    "name": "otel",
    "namespace": "trustify"
  },
  "spec": {
    "config": {
      "connectors": {
        "spanmetrics": {
          "metrics_flush_interval": "15s"
        }
      },
      "exporters": {
        "debug": {},
        "otlp": {
          "auth": {
            "authenticator": "bearertokenauth"
          },
          "endpoint": "tempo-tempo-gateway.trustify.svc.cluster.local:8090",
          "headers": {
            "X-Scope-OrgID": "prod"
          },
          "tls": {
            "ca_file": "/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt",
            "insecure": false
          }
        },
        "prometheus": {
          "endpoint": "0.0.0.0:8889",
          "resource_to_telemetry_conversion": {
            "enabled": true
          }
        }
      },
      "extensions": {
        "bearertokenauth": {
          "filename": "/var/run/secrets/kubernetes.io/serviceaccount/token"
        }
      },
      "processors": {
        "batch": {},
        "k8sattributes": {},
        "memory_limiter": {
          "check_interval": "1s",
          "limit_percentage": 50,
          "spike_limit_percentage": 30
        },
        "resourcedetection": {
          "detectors": [
            "openshift"
          ]
        }
      },
      "receivers": {
        "jaeger": {
          "protocols": {
            "grpc": {
              "endpoint": "0.0.0.0:14250"
            },
            "thrift_binary": {
              "endpoint": "0.0.0.0:6832"
            },
            "thrift_compact": {
              "endpoint": "0.0.0.0:6831"
            },
            "thrift_http": {
              "endpoint": "0.0.0.0:14268"
            }
          }
        },
        "otlp": {
          "protocols": {
            "grpc": {
              "endpoint": "0.0.0.0:4317"
            },
            "http": {
              "endpoint": "0.0.0.0:4318"
            }
          }
        }
      },
      "service": {
        "extensions": [
          "bearertokenauth"
        ],
        "pipelines": {
          "metrics": {
            "exporters": [
              "debug",
              "prometheus"
            ],
            "processors": [
              "k8sattributes",
              "resourcedetection"
            ],
            "receivers": [
              "otlp",
              "spanmetrics"
            ]
          },
          "traces": {
            "exporters": [
              "debug",
              "otlp",
              "spanmetrics"
            ],
            "processors": [
              "memory_limiter",
              "k8sattributes",
              "resourcedetection",
              "batch"
            ],
            "receivers": [
              "otlp",
              "jaeger"
            ]
          }
        },
        "telemetry": {
          "metrics": {
            "readers": [
              {
                "pull": {
                  "exporter": {
                    "prometheus": {
                      "host": "0.0.0.0",
                      "port": 8888
                    }
                  }
                }
              }
            ]
          }
        }
      }
    },
    "configVersions": 3,
    "daemonSetUpdateStrategy": {},
    "deploymentUpdateStrategy": {},
    "httpRoute": {
      "enabled": false,
      "gateway": ""
    },
    "ingress": {
      "route": {}
    },
    "ipFamilyPolicy": "SingleStack",
    "managementState": "managed",
    "mode": "deployment",
    "networkPolicy": {
      "enabled": true
    },
    "observability": {
      "metrics": {}
    },
    "podDnsConfig": {},
    "replicas": 1,
    "resources": {},
    "targetAllocator": {
      "allocationStrategy": "consistent-hashing",
      "collectorNotReadyGracePeriod": "30s",
      "collectorTargetReloadInterval": "30s",
      "filterStrategy": "relabel-config",
      "observability": {
        "metrics": {}
      },
      "prometheusCR": {
        "evaluationInterval": "30s",
        "podMonitorNamespaceSelector": {},
        "probeNamespaceSelector": {},
        "scrapeConfigNamespaceSelector": {},
        "scrapeInterval": "30s",
        "serviceMonitorNamespaceSelector": {}
      },
      "resources": {}
    },
    "upgradeStrategy": "automatic"
  }
}
