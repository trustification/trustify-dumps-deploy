# Outside all Argo CD source paths. Defaults to read-only inspection.
# Terraform owns every Secret referenced below.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: trustify-database-
  namespace: trustify
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: database
          image: docker.io/library/postgres:17.9
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
          env:
            - {name: HOME, value: /tmp}
            - {name: RESET_MODE, value: inspect}
            - {name: PGDATABASE, value: postgres}
            - {name: PGSSLMODE, value: require}
            - name: PGHOST
              valueFrom:
                secretKeyRef: {name: postgresql-admin-credentials, key: db.host}
            - name: PGPORT
              valueFrom:
                secretKeyRef: {name: postgresql-admin-credentials, key: db.port}
            - name: PGUSER
              valueFrom:
                secretKeyRef: {name: postgresql-admin-credentials, key: db.user}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: postgresql-admin-credentials, key: db.password}
            - name: APP_HOST
              valueFrom:
                secretKeyRef: {name: postgresql-credentials, key: db.host}
            - name: APP_DB
              valueFrom:
                secretKeyRef: {name: postgresql-credentials, key: db.name}
            - name: APP_USER
              valueFrom:
                secretKeyRef: {name: postgresql-credentials, key: db.user}
          command:
            - bash
            - -euc
            - |
              test "$PGHOST" = terraform-20250307162757450500000001.cf4uparthbgf.eu-west-1.rds.amazonaws.com
              test "$APP_HOST" = "$PGHOST"
              test "$PGUSER" = postgres
              test "$APP_DB" = trustify_default
              test "$APP_USER" = trustify
              case "$RESET_MODE" in
                inspect)
                  psql -X --set=ON_ERROR_STOP=1 <<'SQL'
              SELECT version();
              SELECT datname, pg_get_userbyid(datdba) AS owner, datcollate
                FROM pg_database WHERE datname = 'trustify_default';
              SELECT name, default_version FROM pg_available_extensions
                WHERE name IN ('pg_trgm', 'pgcrypto', 'uuid-ossp', 'pg_stat_statements');
              SQL
                  ;;
                reset)
                  # Call only after all old application writers have stopped.
                  # Do not enable shell tracing or psql echoing: credentials stay private.
                  psql -X --set=ON_ERROR_STOP=1 <<'SQL'
              \getenv target_db APP_DB
              \getenv app_user APP_USER
              SELECT format('ALTER DATABASE %I ALLOW_CONNECTIONS false', :'target_db')
                WHERE EXISTS (SELECT FROM pg_database WHERE datname = :'target_db')\gexec
              SELECT pg_terminate_backend(pid) FROM pg_stat_activity
                WHERE datname = :'target_db' AND pid <> pg_backend_pid();
              DROP DATABASE IF EXISTS :"target_db";
              CREATE DATABASE :"target_db" OWNER :"app_user" TEMPLATE template0 LC_COLLATE 'C' LC_CTYPE 'C';
              SQL
                  PGDATABASE="$APP_DB" psql -X --set=ON_ERROR_STOP=1 <<'SQL'
              \getenv app_user APP_USER
              GRANT USAGE, CREATE ON SCHEMA public TO :"app_user";
              ALTER DEFAULT PRIVILEGES IN SCHEMA public
                GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO :"app_user";
              ALTER DEFAULT PRIVILEGES IN SCHEMA public
                GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO :"app_user";
              SQL
                  ;;
                *) echo 'Unsupported RESET_MODE' >&2; exit 1 ;;
              esac
