# Manual operation outside all Argo CD source paths. Inspect is read-only.
# Verify versioning is disabled and application writers are stopped before delete.
apiVersion: batch/v1
kind: Job
metadata:
  name: trustify-s3-cleanup
  namespace: trustify
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cleanup
          image: docker.io/library/python:3.14-slim
          command:
            - /bin/sh
            - -ec
            - |
              python -m pip install --no-cache-dir --target=/work/deps -r /scripts/requirements.txt
              exec python -u /scripts/cleanup.py
          env:
            - {name: CLEANUP_MODE, value: inspect}
            - {name: HOME, value: /work}
            - {name: TMPDIR, value: /work}
            - {name: PYTHONPATH, value: /work/deps}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: PIP_DISABLE_PIP_VERSION_CHECK, value: "1"}
            - {name: AWS_EC2_METADATA_DISABLED, value: "true"}
            - name: AWS_DEFAULT_REGION
              valueFrom:
                configMapKeyRef: {name: aws-storage, key: region}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: storage-credentials, key: aws_access_key_id}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: storage-credentials, key: aws_secret_access_key}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "2", memory: 512Mi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: work, mountPath: /work}
      volumes:
        - name: scripts
          configMap: {name: trustify-s3-cleanup}
        - name: work
          emptyDir: {sizeLimit: 512Mi}
