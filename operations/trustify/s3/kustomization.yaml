apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: trustify
resources:
  - job.yaml
configMapGenerator:
  - name: trustify-s3-cleanup
    files:
      - cleanup.py
      - requirements.txt
generatorOptions:
  # A manual, one-off operation; stop the Job before changing its script.
  disableNameSuffixHash: true
